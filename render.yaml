services:
  - type: web
    name: civicvoice-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Secrets: set these manually in the Render dashboard ──
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # ── Set to your Vercel frontend URL after first deploy ──
      # https://civic-issue-reporting-resolution-platform-civic-voice.vercel.app
      - key: FRONTEND_URL
        sync: false
      # ── Optional: Cloudinary image CDN ──
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
